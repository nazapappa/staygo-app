
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAYGO | Recupero password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f7f5f0;
  font-family: Arial, sans-serif;
  color: #202124;
}
header {
  background: #fff;
  padding: 28px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 6px;
}
header span { color: #bba477; }
main {
  max-width: 460px;
  margin: 50px auto;
  padding: 30px;
  background: white;
}
h1 {
  font-family: Georgia, serif;
  font-weight: normal;
}
input {
  width: 100%;
  padding: 16px;
  margin: 10px 0;
  border: 1px solid #ccc;
  font-size: 16px;
}
button {
  width: 100%;
  padding: 18px;
  background: #202124;
  color: white;
  border: none;
  font-size: 16px;
  margin-top: 15px;
}
button:disabled { opacity: .5; }
#message {
  line-height: 1.5;
  margin-top: 20px;
}
a { color: #927a50; }
</style>
</head>

<body>

<header>STAY<span>GO</span></header>

<main>
<h1>Nuova password</h1>
<p>Imposta una nuova password per il tuo account STAYGO.</p>

<form id="resetForm">
<input type="password" id="password"
placeholder="Nuova password"
autocomplete="new-password"
minlength="12" required>

<input type="password" id="confirm"
placeholder="Conferma password"
autocomplete="new-password"
minlength="12" required>

<button id="save" disabled>
Salva nuova password
</button>
</form>

<p id="message" role="status">
Verifica del link di recupero...
</p>

<a href="index.html">Torna alla homepage</a>
</main>

<script>
const db = supabase.createClient(
  "https://zjfcnojzstlwzxeldaqn.supabase.co",
  "sb_publishable_7PH45XJmmxUiZfobZQS6SA_1rtHRZ72"
);

const message = document.getElementById("message");
const save = document.getElementById("save");

db.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY" && session) {
    save.disabled = false;
    message.textContent = "Link verificato. Inserisci la nuova password.";
    history.replaceState(null, "", location.pathname);
  }
});

setTimeout(() => {
  if (save.disabled) {
    message.textContent = "Se il link è scaduto o non valido, richiedi una nuova email di recupero.";
  }
}, 5000);

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (save.disabled) return;

  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;

  if (password.length < 12) {
    message.textContent = "Usa almeno 12 caratteri.";
    return;
  }

  if (password !== confirm) {
    message.textContent = "Le password non coincidono.";
    return;
  }

  save.disabled = true;

  try {
    const { error } = await db.auth.updateUser({
      password: password
    });

    if (error) throw error;

    message.textContent = "Password aggiornata correttamente!";
    await db.auth.signOut();
    setTimeout(() => {
      window.location.href = "index.html";
    }, 2000);

  } catch (error) {
    message.textContent = error.message;
    save.disabled = false;
  }
});
</script>

</body>
</html>
